<script>
(function() {
  'use strict';

  // ===== 定数 =====
  var STORAGE_PREFIX = 'bento_draft_v1_';
  var AUTO_SAVE_DELAY = 3000;
  var PERIODIC_SAVE_INTERVAL = 30000;
  var RESERVATION_WINDOW_DAYS = 14;
  var DEADLINE_HOUR = 8;
  var SAT_DEADLINE_HOUR = 15;
  var EARLY_DEADLINE_HOUR = 8;     // 麺・丼・特弁: 前の平日の 8:00
  var MONTH_START_DAY = 16;
  var TOKU_BANNER_DAYS = 21;       // 特弁のお知らせを何日前から出すか

  var WEEKDAY_JP = ['日', '月', '火', '水', '木', '金', '土'];
  var EARLY_KEYS = ['men', 'don', 'toku'];

  // ===== グローバル状態 =====
  var state = {
    workers: [],
    calendar: [],
    calendarMap: {},  // date → entry
    reservations: {},  // key "code_date" → reservation
    menus: [],
    periods: [],
    tokus: [],
    isAdmin: false,
    adminUrl: '',
    currentUser: null,
    locationMode: false,
    saveStatus: 'saved',
    today: null,  // Date
    todayStr: ''
  };

  // ===== GasPromise: google.script.run の Promise 化 =====
  var GasPromise = {
    call: function(fnName) {
      var args = Array.prototype.slice.call(arguments, 1);
      return new Promise(function(resolve, reject) {
        var runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(function(err) {
            reject(err instanceof Error ? err : new Error(err && err.message ? err.message : String(err)));
          });
        runner[fnName].apply(runner, args);
      });
    }
  };

  // ===== A層: DraftStore =====
  var DraftStore = (function() {
    var availability = null;

    function detect() {
      if (availability !== null) return availability;
      try {
        localStorage.setItem('__bento_test__', '1');
        localStorage.removeItem('__bento_test__');
        availability = 'local';
      } catch (e) {
        try {
          sessionStorage.setItem('__bento_test__', '1');
          sessionStorage.removeItem('__bento_test__');
          availability = 'session';
        } catch (e2) {
          availability = 'none';
        }
      }
      return availability;
    }

    function store() {
      var a = detect();
      if (a === 'local') return localStorage;
      if (a === 'session') return sessionStorage;
      return null;
    }

    function key(workerCode) { return STORAGE_PREFIX + workerCode; }

    function save(workerCode, changes) {
      var s = store();
      if (!s) return;
      try {
        var existing = load(workerCode) || {};
        changes.forEach(function(c) {
          existing[c.date] = { orderState: c.orderState, location: c.location, _ts: Date.now() };
        });
        s.setItem(key(workerCode), JSON.stringify(existing));
      } catch (e) { console.warn('Draft save failed', e); }
    }

    function load(workerCode) {
      var s = store();
      if (!s) return null;
      try {
        var v = s.getItem(key(workerCode));
        return v ? JSON.parse(v) : null;
      } catch (e) { return null; }
    }

    function clearDates(workerCode, dates) {
      var s = store();
      if (!s) return;
      try {
        var existing = load(workerCode) || {};
        dates.forEach(function(d) { delete existing[d]; });
        if (Object.keys(existing).length === 0) s.removeItem(key(workerCode));
        else s.setItem(key(workerCode), JSON.stringify(existing));
      } catch (e) {}
    }

    return { save: save, load: load, clearDates: clearDates, detect: detect };
  })();

  // ===== C層: ChangeQueue =====
  var ChangeQueue = (function() {
    var queue = {};
    var pendingTimer = null;
    var seq = 0;

    function keyOf(c) { return c.workerCode + '_' + c.date; }

    return {
      add: function(change) {
        queue[keyOf(change)] = Object.assign({}, change, { _seq: ++seq });
      },
      hasChanges: function() { return Object.keys(queue).length > 0; },
      getAll: function() {
        return Object.keys(queue).map(function(k) { return queue[k]; })
          .sort(function(a, b) { return a._seq - b._seq; });
      },
      clearSaved: function(saved) {
        saved.forEach(function(s) { delete queue[s.workerCode + '_' + s.date]; });
      },
      // 送信した時点の変更（_seq が同じ）がまだ残っていれば消す。送信中に選び直した新しい変更は残す
      clearIfSame: function(key, sentSeq) {
        if (queue[key] && queue[key]._seq === sentSeq) { delete queue[key]; return true; }
        return false;
      },
      isSuperseded: function(key, sentSeq) {
        return !!(queue[key] && queue[key]._seq !== sentSeq);
      },
      clearAll: function() { queue = {}; },
      setTimer: function(t) { pendingTimer = t; },
      clearTimer: function() { if (pendingTimer) { clearTimeout(pendingTimer); pendingTimer = null; } }
    };
  })();

  // ===== B層: SaveManager =====
  var SaveManager = {
    isSaving: false,
    periodicTimer: null,

    scheduleSave: function() {
      ChangeQueue.clearTimer();
      updateSaveStatus('unsaved');
      ChangeQueue.setTimer(setTimeout(flushChanges, AUTO_SAVE_DELAY));
    },

    startPeriodic: function() {
      if (this.periodicTimer) clearInterval(this.periodicTimer);
      this.periodicTimer = setInterval(function() {
        if (ChangeQueue.hasChanges() && !SaveManager.isSaving) flushChanges();
      }, PERIODIC_SAVE_INTERVAL);
    }
  };

  // ===== 保存状態表示 =====
  function updateSaveStatus(status) {
    state.saveStatus = status;
    var dot = document.getElementById('saveDot');
    var label = document.getElementById('saveLabel');
    if (!dot || !label) return;
    var map = {
      saved:    ['保存済み',   ''],
      saving:   ['保存中...',  'saving'],
      unsaved:  ['未保存',     'unsaved'],
      error:    ['保存失敗',   'error'],
      offline:  ['オフライン', 'offline']
    };
    var info = map[status] || map.saved;
    label.textContent = info[0];
    dot.className = 'cal-save-dot ' + info[1];
  }

  // ===== 保存実行 =====
  function flushChanges() {
    if (!ChangeQueue.hasChanges() || SaveManager.isSaving) return Promise.resolve();
    if (!navigator.onLine) { updateSaveStatus('offline'); return Promise.resolve(); }

    SaveManager.isSaving = true;
    updateSaveStatus('saving');

    var sent = ChangeQueue.getAll();
    var sentSeq = {};  // key → 送ったときの _seq（送信中に選び直された変更を消さないため）
    sent.forEach(function(c) { sentSeq[c.workerCode + '_' + c.date] = c._seq; });
    var changes = sent.map(function(c) {
      return {
        workerCode: c.workerCode,
        workerName: c.workerName,
        date: c.date,
        orderState: c.orderState,
        location: c.location
      };
    });

    return GasPromise.call('api_applyPatch', changes).then(function(results) {
      var ok = (results || []).filter(function(r) { return r.success; });
      var ng = (results || []).filter(function(r) { return !r.success; });
      // 成功した変更はキュー・下書き・stateに反映（送信中に選び直した日は、新しい選択を残す）
      ok.forEach(function(r) {
        var key = r.workerCode + '_' + r.date;
        if (!ChangeQueue.clearIfSame(key, sentSeq[key])) return;
        DraftStore.clearDates(r.workerCode, [r.date]);
        if (r.row) {
          state.reservations[key] = r.row;
        } else {
          delete state.reservations[key];
        }
      });
      if (ng.length > 0) {
        console.error('Partial save failure:', ng);
        // 何度送っても通らない変更（締切後・期間外など）はキューと下書きから外し、表示をサーバーの状態に戻す
        var permanent = ng.filter(function(r) { return r.permanent || isDateLocked(r.date); });
        var reverted = permanent.filter(function(r) {
          var key = r.workerCode + '_' + r.date;
          if (!ChangeQueue.clearIfSame(key, sentSeq[key])) return false;
          DraftStore.clearDates(r.workerCode, [r.date]);
          if (r.current && r.current.orderState) state.reservations[key] = r.current;
          else delete state.reservations[key];
          return true;
        });
        if (state.currentUser && reverted.some(function(r) { return r.workerCode === state.currentUser.code; })) {
          renderCalendar();
        }
        // 古い下書きの掃除（日付が締切済み）だけなら、ユーザー操作の結果ではないためエラー表示しない
        var shown = reverted.filter(function(r) { return !isDateLocked(r.date); });
        if (shown.length > 0) showToast(shown[0].error || '保存できませんでした', true);
        var retry = ng.length - permanent.length;
        updateSaveStatus(retry > 0 ? 'error' : (ChangeQueue.hasChanges() ? 'unsaved' : 'saved'));
      } else {
        updateSaveStatus(ChangeQueue.hasChanges() ? 'unsaved' : 'saved');
      }
      // 送信中に選び直された変更があれば、続けて保存する（通信エラーの再送は30秒ごとの定期保存に任せる）
      if (ChangeQueue.hasChanges() && !retry) SaveManager.scheduleSave();
    }).catch(function(err) {
      console.error('Save failed:', err);
      updateSaveStatus('error');
    }).then(function() {
      SaveManager.isSaving = false;
    });
  }

  // ===== オフライン/オンライン検知 =====
  window.addEventListener('online', function() {
    if (ChangeQueue.hasChanges()) { updateSaveStatus('unsaved'); SaveManager.scheduleSave(); }
    else updateSaveStatus('saved');
  });
  window.addEventListener('offline', function() { updateSaveStatus('offline'); });
  window.addEventListener('beforeunload', function(e) {
    if (ChangeQueue.hasChanges()) {
      flushChanges();
      e.preventDefault();
      e.returnValue = '保存されていない変更があります';
    }
  });

  // ===== 初期化 =====
  function init() {
    state.todayStr = INIT_TODAY;
    state.today = new Date(INIT_TODAY + 'T00:00:00+09:00');

    // 読み込み表示
    var n = document.getElementById('noticeArea');
    if (n) n.textContent = '読み込み中...';

    GasPromise.call('api_bootstrap').then(function(data) {
      state.workers = data.workers || [];
      state.calendar = data.calendar || [];
      state.calendarMap = {};
      state.calendar.forEach(function(c) { state.calendarMap[c.date] = c; });
      state.reservations = {};
      (data.reservations || []).forEach(function(r) {
        state.reservations[r.workerCode + '_' + r.date] = r;
      });
      state.menus = data.menus || [];
      state.periods = data.menuPeriods || [];
      state.tokus = data.tokus || [];
      state.isAdmin = !!data.isAdmin;
      state.adminUrl = data.adminUrl || '';

      renderAdminButton();
      renderNotice(data.notice, data.warning);
      renderExtras();
      renderDeptDropdown();
      setupSearch();
      setupButtons();
      SaveManager.startPeriodic();
    }).catch(function(err) {
      console.error('Bootstrap failed:', err);
      var n2 = document.getElementById('noticeArea');
      if (n2) { n2.textContent = 'データ取得に失敗しました: ' + (err.message || err); n2.style.background = '#fef2f2'; n2.style.borderLeftColor = '#e85050'; }
    });
  }

  // ===== 総務設定ボタン（設定できる人だけ） =====
  function renderAdminButton() {
    var b = document.getElementById('adminBtn');
    if (!b) return;
    if (state.isAdmin && state.adminUrl) {
      b.href = state.adminUrl;
      b.style.display = '';
      b.onclick = function(e) { e.preventDefault(); openAdmin(); };
    } else {
      b.style.display = 'none';
    }
  }

  // 総務設定は予約画面の上に重ねた枠の中で開く。
  // Google の枠の中からは同じタブでページを切り替えられないため（社内ポータルの中でも同じ画面で開ける）
  function openAdmin() {
    var ov = document.getElementById('adminOv');
    var fr = document.getElementById('adminFrame');
    if (!ov || !fr || !state.adminUrl) return;
    fr.src = state.adminUrl + (state.adminUrl.indexOf('?') >= 0 ? '&' : '?') + 'embed=1';
    ov.classList.add('active');
  }

  // 戻ったら、総務が変えた受付期間・特弁を予約画面に反映する
  function closeAdmin() {
    var ov = document.getElementById('adminOv');
    var fr = document.getElementById('adminFrame');
    if (ov) ov.classList.remove('active');
    if (fr) fr.src = 'about:blank';
    GasPromise.call('api_bootstrap').then(function(data) {
      state.menus = data.menus || state.menus;
      state.periods = data.menuPeriods || [];
      state.tokus = data.tokus || [];
      renderExtras();
      if (state.currentUser) renderCalendar();
    }).catch(function(err) { console.error('refresh after admin failed:', err); });
  }
  (function() {
    var back = document.getElementById('adminBack');
    if (back) back.onclick = closeAdmin;
  })();

  // ===== お知らせ描画 =====
  function renderNotice(notice, warning) {
    var n = document.getElementById('noticeArea');
    var w = document.getElementById('warningArea');
    if (n) {
      if (notice) {
        n.innerHTML = escapeHtml(notice).replace(/\n/g, '<br>');
        n.style.display = '';
      } else {
        n.style.display = 'none';
      }
    }
    if (w) {
      if (warning) {
        w.innerHTML = escapeHtml(warning).replace(/\n/g, '<br>');
        w.style.display = '';
      } else {
        w.style.display = 'none';
      }
    }
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function(c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ===== 日付ヘルパー（JSTのYYYY-MM-DD文字列で計算） =====
  function dObj(ds) { return new Date(ds + 'T12:00:00+09:00'); }
  function dowOf(ds) { return dObj(ds).getUTCDay(); }
  function addDaysStr(ds, n) {
    var d = dObj(ds);
    d.setTime(d.getTime() + n * 86400000);
    return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2);
  }
  function mdLabel(ds) {
    var d = dObj(ds);
    return (d.getUTCMonth() + 1) + '月' + d.getUTCDate() + '日（' + WEEKDAY_JP[d.getUTCDay()] + '）';
  }
  function mdShort(ds) {
    var d = dObj(ds);
    return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + WEEKDAY_JP[d.getUTCDay()] + '）';
  }
  function hmOf(date) {
    // 端末の時刻をJSTの「HH:mm」で表示（締切は8:00/15:00固定なので表示用）
    var j = new Date(date.getTime() + 9 * 3600000);
    return ('0' + j.getUTCHours()).slice(-2) + ':' + ('0' + j.getUTCMinutes()).slice(-2);
  }
  function deadlineLabel(date) {
    var j = new Date(date.getTime() + 9 * 3600000);
    return (j.getUTCMonth() + 1) + '/' + j.getUTCDate() + '（' + WEEKDAY_JP[j.getUTCDay()] + '）' + hmOf(date);
  }

  // ===== 社内カレンダーの判定 =====
  function isWorkSatDs(ds) {
    var c = state.calendarMap[ds];
    return !!(c && c.type === '出勤土曜');
  }
  function isOffMaster(ds) {
    var c = state.calendarMap[ds];
    return !!(c && (c.type === '休日' || c.type === '祝日'));
  }
  function isHolidayDs(ds) {
    var w = dowOf(ds);
    return isOffMaster(ds) || w === 0 || (w === 6 && !isWorkSatDs(ds));
  }
  function isWeekdayBiz(ds) {
    var w = dowOf(ds);
    return w >= 1 && w <= 5 && !isOffMaster(ds);
  }
  function prevWeekdayBiz(ds) {
    var d = addDaysStr(ds, -1);
    for (var i = 0; i < 30; i++) {
      if (isWeekdayBiz(d)) return d;
      d = addDaysStr(d, -1);
    }
    return d;
  }

  // ===== メニューのルール =====
  function menuDef(key) {
    for (var i = 0; i < state.menus.length; i++) if (state.menus[i].key === key) return state.menus[i];
    return null;
  }
  function isEarly(key) { return EARLY_KEYS.indexOf(key) !== -1; }
  function periodOf(key, ds) {
    for (var i = 0; i < state.periods.length; i++) {
      var p = state.periods[i];
      if (p.menu === key && p.from <= ds && ds <= p.to) return p;
    }
    return null;
  }
  function tokuOn(ds) {
    for (var i = 0; i < state.tokus.length; i++) if (state.tokus[i].date === ds) return state.tokus[i];
    return null;
  }
  function offered(key, ds) {
    var m = menuDef(key);
    if (!m) return false;
    if (m.kind === 'always') return true;
    if (m.kind === 'day') return !!tokuOn(ds);
    return !!periodOf(key, ds);
  }
  function earlyDeadline(ds) {
    return new Date(prevWeekdayBiz(ds) + 'T' + ('0' + EARLY_DEADLINE_HOUR).slice(-2) + ':00:00+09:00');
  }
  /** 麺・丼・特弁を今まだ選べるか */
  function earlyOpen(key, ds) {
    return offered(key, ds) && new Date() < earlyDeadline(ds);
  }
  function priceOf(key, ds) {
    if (key === 'toku') { var t = tokuOn(ds); return t ? t.price : 0; }
    var m = menuDef(key);
    return m ? m.price : 0;
  }
  function labelOf(key) { var m = menuDef(key); return m ? m.label : key; }

  /** 今日以降に麺・丼・特弁の設定があるか（なければ従来どおりの静かな画面） */
  function hasExtras() {
    var t = state.todayStr;
    return state.periods.some(function(p) { return p.to >= t; }) ||
           state.tokus.some(function(x) { return x.date >= t; });
  }
  function anyEarlyOffered(ds) {
    return EARLY_KEYS.some(function(k) { return offered(k, ds); });
  }
  /** 平日 ds の朝8:00が締切になる日 */
  function daysDueOn(ds) {
    if (!isWeekdayBiz(ds)) return [];
    var out = [];
    for (var i = 1; i <= 20; i++) {
      var d = addDaysStr(ds, i);
      if (isHolidayDs(d)) continue;
      var pd = prevWeekdayBiz(d);
      if (pd === ds) out.push(d);
      else if (pd > ds) break;
    }
    return out;
  }
  /** 次に来る麺・丼・特弁の締切 {due:Date, dueDs, targets:[ds]} */
  function nextDue() {
    var now = new Date();
    for (var i = 0; i < 25; i++) {
      var ds = addDaysStr(state.todayStr, i);
      var due = new Date(ds + 'T' + ('0' + EARLY_DEADLINE_HOUR).slice(-2) + ':00:00+09:00');
      if (due <= now) continue;
      var targets = daysDueOn(ds).filter(anyEarlyOffered);
      if (targets.length > 0) return { due: due, dueDs: ds, targets: targets };
    }
    return null;
  }

  // ===== メニューのアイコン =====
  function iconHtml(key, where) {
    var src = (window.MENU_ICONS || {})[key];
    if (!src) return '';
    return '<img class="mi mi-' + where + '" src="' + src + '" alt="' + escapeHtml(labelOf(key)) + '">';
  }

  // ===== 麺・丼・特弁のご案内（1行のお知らせ＋入力窓の下の案内欄） =====
  var Ticker = { items: [], i: 0, timer: null };

  function renderExtras() {
    var sec = document.getElementById('extraSec');
    var tk = document.getElementById('ticker');
    if (!hasExtras()) {
      if (sec) sec.style.display = 'none';
      if (tk) tk.style.display = 'none';
      return;
    }
    sec.style.display = '';
    renderCountdown();
    renderTokuBanner();
    renderPeriodBox();
    renderTicker();
  }

  function renderCountdown() {
    var el = document.getElementById('countdown');
    var nd = nextDue();
    if (!nd) { el.innerHTML = ''; return; }
    var mins = Math.round((nd.due - new Date()) / 60000);
    var left = mins < 60 ? 'あと' + mins + '分' : (mins < 24 * 60 ? 'あと' + Math.floor(mins / 60) + '時間' : '');
    var tg = nd.targets.map(mdShort).join('・');
    var hasToku = nd.targets.some(function(d) { return !!tokuOn(d); });
    if (nd.dueDs === state.todayStr) {
      el.innerHTML = '<div class="countdown"><span class="big">⏰</span><div><b>今朝8:00で締切</b>（' + left + '）<br>' + tg + ' の麺・丼' + (hasToku ? '・特弁' : '') + '</div></div>';
    } else {
      el.innerHTML = '<div class="countdown calm"><span class="big">🗓</span><div><b>次の締切：' + mdLabel(nd.dueDs) + ' 朝8:00</b>' + (left ? '（' + left + '）' : '') + '<br>' + tg + ' の分</div></div>';
    }
  }

  function renderTokuBanner() {
    var el = document.getElementById('tokuBanner');
    var t0 = state.todayStr, lim = addDaysStr(t0, TOKU_BANNER_DAYS);
    var up = state.tokus.filter(function(x) { return x.date >= t0 && x.date <= lim; })
      .sort(function(a, b) { return a.date < b.date ? -1 : 1; });
    if (up.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = up.map(function(x) {
      var closed = new Date() >= earlyDeadline(x.date);
      return '<div class="toku-banner">' + iconHtml('toku', 'big') +
        '<div><h3>⭐ 特弁のお知らせ</h3><div class="tn">' + escapeHtml(mdLabel(x.date) + '　' + x.name + '　¥' + x.price) + '</div>' +
        '<div class="tm">' + (closed ? '🔒 受付は締め切りました' : '締切：' + deadlineLabel(earlyDeadline(x.date)) + ' まで（1日かぎり）') +
        (x.flyerId ? '　<button type="button" class="flyer-btn" data-fly="' + escapeHtml(x.flyerId) + '" data-title="' + escapeHtml('特弁 ' + x.name) + '">📄 チラシを見る</button>' : '') +
        '</div></div></div>';
    }).join('');
  }

  function renderPeriodBox() {
    var el = document.getElementById('periodBox');
    var t0 = state.todayStr;
    var vp = state.periods.filter(function(p) { return p.to >= t0; })
      .sort(function(a, b) { return a.from < b.from ? -1 : 1; });
    if (vp.length === 0) { el.innerHTML = ''; return; }
    var h = '<h3>麺・丼の受付期間</h3>';
    vp.forEach(function(p) {
      h += '<div class="period-item">' + iconHtml(p.menu, 'sm') + '<b>' + escapeHtml(labelOf(p.menu)) + '</b>' +
        (p.from <= t0 ? '<span class="pstat open">受付中</span>' : '<span class="pstat soon">受付予定</span>') +
        '<span>' + mdLabel(p.from) + ' 〜 ' + mdLabel(p.to) + '</span>' +
        (p.name ? '<span style="color:#a09080">' + escapeHtml(p.name) + '</span>' : '') +
        (p.flyerId ? '<button type="button" class="flyer-btn" data-fly="' + escapeHtml(p.flyerId) + '" data-title="' + escapeHtml(labelOf(p.menu) + 'メニュー' + (p.name ? '（' + p.name + '）' : '')) + '">📄 ' + escapeHtml(labelOf(p.menu)) + 'メニューはこちら</button>' : '') +
        '</div>';
    });
    el.innerHTML = h;
  }

  function tickerItems() {
    var out = [];
    var t0 = state.todayStr;
    var nd = nextDue();
    if (nd && nd.dueDs === t0) {
      var mins = Math.round((nd.due - new Date()) / 60000);
      out.push({ hot: true, lab: '締切', txt: '⏰ 今朝8:00締切（あと' + (mins < 60 ? mins + '分' : Math.floor(mins / 60) + '時間') + '）：' + nd.targets.map(mdShort).join('・') + ' の麺・丼' });
    }
    var lim = addDaysStr(t0, TOKU_BANNER_DAYS);
    state.tokus.filter(function(x) { return x.date >= t0 && x.date <= lim; }).forEach(function(x) {
      out.push({ lab: '特弁', txt: '⭐ ' + mdShort(x.date) + ' 特弁「' + x.name + '」¥' + x.price + (new Date() >= earlyDeadline(x.date) ? '（受付終了）' : '　締切 ' + deadlineLabel(earlyDeadline(x.date))) });
    });
    state.periods.filter(function(p) { return p.to >= t0; })
      .sort(function(a, b) { return a.from < b.from ? -1 : 1; })
      .forEach(function(p) {
        var l = labelOf(p.menu);
        out.push({ lab: l, txt: (p.name ? p.name + '：' : '') + (p.from <= t0 ? l + 'を受付中（〜' + mdShort(p.to) + '）' : mdShort(p.from) + 'から' + l + 'の受付を始めます') });
      });
    if (out.length > 0) out.push({ lab: 'ルール', txt: '📢 麺・丼・特弁の締切は「前の平日の朝8時」です（月曜分は金曜の朝）' });
    return out;
  }

  function renderTicker() {
    var el = document.getElementById('ticker');
    Ticker.items = tickerItems();
    if (Ticker.items.length === 0) { el.style.display = 'none'; return; }
    el.style.display = '';
    if (Ticker.i >= Ticker.items.length) Ticker.i = 0;
    drawTicker(false);
    if (!Ticker.timer) {
      Ticker.timer = setInterval(function() {
        Ticker.items = tickerItems();
        if (Ticker.items.length === 0) return;
        Ticker.i = (Ticker.i + 1) % Ticker.items.length;
        drawTicker(true);
      }, 4500);
    }
    el.onclick = function() {
      var s = document.getElementById('extraSec');
      if (s && s.scrollIntoView) s.scrollIntoView({ behavior: 'smooth', block: 'start' });
    };
  }

  function drawTicker(anim) {
    var el = document.getElementById('ticker');
    var it = Ticker.items[Ticker.i];
    if (!it) return;
    el.innerHTML = '<span class="tk-lab' + (it.hot ? ' hot' : '') + '">' + escapeHtml(it.lab) + '</span>' +
      '<span class="tk-txt' + (anim ? ' fade' : '') + '">' + escapeHtml(it.txt) + '</span>' +
      '<span class="tk-dots">' + Ticker.items.map(function(_, j) { return '<i class="' + (j === Ticker.i ? 'on' : '') + '"></i>'; }).join('') + '</span>' +
      '<span class="tk-more">詳しく ▼</span>';
    if (anim) setTimeout(function() { var x = el.querySelector('.tk-txt'); if (x) x.classList.remove('fade'); }, 30);
  }

  // ===== インクリメンタルサーチ =====
  // 名前中の空白（半角・全角）を無視して照合する。
  // データ側の名前に含まれるスペースと入力のスペースが一致しなくてもヒットさせる。
  function normalizeName(s) {
    return String(s).replace(/[\s　]/g, '');
  }

  function setupSearch() {
    var input = document.getElementById('name-search');
    var dropdown = document.getElementById('searchDropdown');

    input.addEventListener('input', function() {
      var q = this.value.trim();
      dropdown.innerHTML = '';
      if (!q) { dropdown.classList.remove('active'); return; }
      var qn = normalizeName(q);
      var matches = state.workers.filter(function(w) {
        return normalizeName(w.name).indexOf(qn) !== -1 || (w.code && w.code.indexOf(q) === 0);
      });
      if (matches.length === 0) { dropdown.classList.remove('active'); return; }
      matches.slice(0, 20).forEach(function(w) {
        var div = document.createElement('div');
        div.className = 'search-dropdown-item';
        div.innerHTML = escapeHtml(w.name) + '<span class="dept-tag">' + escapeHtml(w.dept) + '</span>';
        div.onclick = function() {
          input.value = w.name;
          dropdown.classList.remove('active');
          openCalendarByCode(w.code);
        };
        dropdown.appendChild(div);
      });
      dropdown.classList.add('active');
    });

    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter' && this.value.trim()) {
        var q = this.value.trim();
        var qn = normalizeName(q);
        var match = state.workers.filter(function(w) { return normalizeName(w.name) === qn; })[0];
        if (!match) match = state.workers.filter(function(w) { return normalizeName(w.name).indexOf(qn) !== -1; })[0];
        if (match) {
          dropdown.classList.remove('active');
          openCalendarByCode(match.code);
        }
      }
    });

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.bento-inner')) dropdown.classList.remove('active');
    });
  }

  // ===== カレンダーを開く =====
  function openCalendarByCode(workerCode) {
    var worker = state.workers.filter(function(w) { return w.code === String(workerCode); })[0];
    if (!worker) return;
    state.currentUser = worker;
    state.locationMode = false;
    state.hadAnyChangeThisSession = false;
    document.getElementById('calBentoBox').classList.remove('location-mode');
    document.getElementById('locationBtn').classList.remove('active');

    document.getElementById('calUser').textContent =
      worker.name + ' さん ── ' + worker.dept + '・' + worker.location;

    // クラッシュリカバリ: ドラフトがあればマージしてChangeQueueに積む
    recoverDraftForUser(worker);

    renderCalendar();
    document.getElementById('calendarModal').classList.add('active');
  }

  // ===== ドラフト復元 =====
  function recoverDraftForUser(worker) {
    var draft = DraftStore.load(worker.code);
    if (!draft) return;
    var allDates = Object.keys(draft);
    if (allDates.length === 0) return;
    // 保存が永久に失敗する下書き（過去日・締切超過・麺丼の締切後や期間外）は復元せず破棄し、再送ループを防ぐ
    var unsavable = allDates.filter(function(date) {
      var server = state.reservations[worker.code + '_' + date];
      return isChangeLocked(date, (draft[date] || {}).orderState || '', server ? server.orderState : '');
    });
    if (unsavable.length > 0) {
      DraftStore.clearDates(worker.code, unsavable);
      console.info('Purged unsavable drafts: ' + unsavable.length + ' dates');
    }
    var dates = allDates.filter(function(date) { return unsavable.indexOf(date) === -1; });
    if (dates.length === 0) return;
    console.info('Recovering draft: ' + dates.length + ' dates');
    dates.forEach(function(date) {
      var d = draft[date];
      // stateに反映
      var key = worker.code + '_' + date;
      state.reservations[key] = {
        workerCode: worker.code,
        workerName: worker.name,
        date: date,
        orderState: d.orderState || '',
        location: d.location || worker.location
      };
      // ChangeQueueに積む（未送信扱い）
      ChangeQueue.add({
        workerCode: worker.code,
        workerName: worker.name,
        date: date,
        orderState: d.orderState || '',
        location: d.location || worker.location
      });
    });
    state.hadAnyChangeThisSession = true;
    SaveManager.scheduleSave();
  }

  // ===== カレンダー描画 =====
  function renderCalendar() {
    var today = state.today;
    var y = today.getFullYear();
    var m = today.getMonth();  // 0-11

    // 現在の月（上）と次の月（下）の2ヶ月分を表示
    var monthStart = new Date(y, m, 1);                // 今月1日
    var monthEnd = new Date(y, m + 2, 0);              // 翌月末日

    // タイトル
    var curM = monthStart.getMonth() + 1;
    var curY = monthStart.getFullYear();
    var nextDate = new Date(y, m + 1, 1);
    var nextM = nextDate.getMonth() + 1;
    var nextY = nextDate.getFullYear();
    document.getElementById('calTitle').textContent =
      curY + '年' + curM + '月・' + (nextY !== curY ? nextY + '年' : '') + nextM + '月';

    // グリッド生成
    var grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    // 日付配列を生成
    var dates = [];
    var cur = new Date(monthStart);
    while (cur <= monthEnd) {
      dates.push(new Date(cur));
      cur.setDate(cur.getDate() + 1);
    }

    var lastMonthRendered = -1;
    dates.forEach(function(d) {
      var dMonth = d.getMonth();
      var dow = d.getDay();

      // 月が変わったら月ラベルを挿入し、その曜日まで空セルで埋める
      if (dMonth !== lastMonthRendered) {
        var labelDiv = document.createElement('div');
        labelDiv.className = 'month-label';
        labelDiv.textContent = '── ' + (dMonth + 1) + '月 ──';
        grid.appendChild(labelDiv);
        // ラベル（全幅）の後、その日の曜日まで空セルを挿入
        for (var i = 0; i < dow; i++) {
          var empty = document.createElement('div');
          empty.className = 'cal-cell empty-cell';
          grid.appendChild(empty);
        }
        lastMonthRendered = dMonth;
      }
      grid.appendChild(buildCell(d));
    });

    renderSummary(monthStart, monthEnd);
    renderCalendarExtras(formatYmd(monthStart), formatYmd(monthEnd));
    renderLegend();
  }

  /** カレンダーの中の麺・丼・特弁の注意書きとチラシボタン（設定がなければ出さない） */

      (nd ? '　→ 次の締切：' + (nd.dueDs === state.todayStr ? '<b>今朝8:00</b>' : escapeHtml(mdLabel(nd.dueDs)) + ' 8:00') + '（' + nd.targets.map(mdShort).join('・') + '分）' : '');
    var t0 = state.todayStr, btns = [];

      btns.push('<button type="button" class="flyer-btn" data-fly="' + escapeHtml(p.flyerId) + '" data-title="' + escapeHtml(labelOf(p.menu) + 'メニュー' + (p.name ? '（' + p.name + '）' : '')) + '">' + iconHtml(p.menu, 'sm') + ' ' + escapeHtml(labelOf(p.menu)) + 'メニュー' + (p.name ? '（' + escapeHtml(p.name) + '）' : '') + '</button>');
    });

  function renderLegend() {

  function buildCell(d) {
    var dateStr = formatYmd(d);
    var dow = d.getDay();
    var cell = document.createElement('div');
    cell.className = 'cal-cell';
    cell.setAttribute('data-date', dateStr);

    var dateNum = document.createElement('span');
    dateNum.className = 'date-num';
    if (dow === 0) dateNum.className += ' sun';
    else if (dow === 6) dateNum.className += ' sat';
    dateNum.textContent = d.getDate();
    cell.appendChild(dateNum);

    // カレンダーマスタ判定
    var calEntry = state.calendarMap[dateStr];
    var isWorkSat = calEntry && calEntry.type === '出勤土曜';
    var isHolidayExplicit = calEntry && (calEntry.type === '休日' || calEntry.type === '祝日');
    var isHoliday = isHolidayExplicit || (dow === 0) || (dow === 6 && !isWorkSat);

    if (isHoliday) {
      cell.className = 'cal-cell holiday';
      var icon = document.createElement('span');
      icon.className = 'order-icon';
      icon.style.color = '#ccc';
      icon.textContent = '━';
      cell.appendChild(icon);
      var label = document.createElement('span');
      label.className = 'holiday-label';
      label.textContent = calEntry && calEntry.type === '祝日' ? (calEntry.note || '祝日') : '休日';
      cell.appendChild(label);
      return cell;
    }

    if (isWorkSat) {
      cell.classList.add('work-sat');
    }
    if (tokuOn(dateStr)) cell.classList.add('toku-day');

    // 予約状態取得
    var rez = state.reservations[state.currentUser.code + '_' + dateStr];
    var orderState = rez ? rez.orderState : '';
    var location = rez ? rez.location : state.currentUser.location;

    applyCellDisplay(cell, orderState, location);

    // 麺・丼・特弁の受付日マーク（線＝締切済み）
    var chips = EARLY_KEYS.filter(function(k) { return offered(k, dateStr); });
    if (chips.length > 0) {
      var cw = document.createElement('div');
      cw.className = 'menu-chips';
      chips.forEach(function(k) {
        var sp = document.createElement('span');
        sp.className = 'mchip ' + k + (earlyOpen(k, dateStr) ? '' : ' closed');
        sp.textContent = k === 'toku' ? '特' : labelOf(k);
        cw.appendChild(sp);
      });
      cell.appendChild(cw);
    }

    // 今日ハイライト
    if (dateStr === state.todayStr) cell.classList.add('today');

    // 過去・締切済み・予約不可期間
    if (dateStr < state.todayStr) {
      cell.classList.add('disabled');
    } else if (dateStr === state.todayStr && isPastTodayDeadline()) {
      cell.classList.add('disabled');
    } else if (isWorkSat && isPastSatDeadline(dateStr)) {
      cell.classList.add('disabled');
    } else if (isBeyondWindow(dateStr)) {
      cell.classList.add('future-locked');
    } else if (orderState && isEarly(orderState) && new Date() >= earlyDeadline(dateStr)) {
      // 麺・丼・特弁は前の平日の朝に注文済み。利用者は変更・取消できない
      cell.classList.add('menu-locked');
      cell.title = labelOf(orderState) + 'は注文済みのため変更できません。総務へご連絡ください';
      cell.addEventListener('click', function() {
        showToast(labelOf(orderState) + 'は ' + deadlineLabel(earlyDeadline(dateStr)) + ' に西原屋さんへ注文済みのため、変更・取消できません。総務へご連絡ください', true);
      });
    } else {
      cell.addEventListener('click', function() { onCellClick(dateStr, cell); });
    }

    return cell;
  }

  function applyCellDisplay(cell, orderState, location) {
    // 既存の状態クラスを除去
    cell.classList.remove('empty', 'bento', 'okazu', 'men', 'don', 'toku');
    // 子要素からorder-icon, order-label, location-badgeを除去
    Array.prototype.slice.call(cell.querySelectorAll('.order-icon, .order-label, .location-badge')).forEach(function(el) {
      el.parentNode.removeChild(el);
    });

    var icon = document.createElement('span');
    icon.className = 'order-icon';
    var label = document.createElement('span');
    label.className = 'order-label';
    var dateStr = cell.getAttribute('data-date');

    if (orderState && menuDef(orderState)) {
      cell.classList.add(orderState);
      icon.innerHTML = iconHtml(orderState, 'cell');
      // 文字で見分けられるよう、メニュー名を色付きの札で大きく出し、金額を添える
      var done = isEarly(orderState) && new Date() >= earlyDeadline(dateStr);
      var shortName = orderState === 'okazu' ? 'おかず' : labelOf(orderState);   // スマホの狭いマス用
      label.innerHTML = '<span class="ol-name"><span class="ol-full">' + escapeHtml(labelOf(orderState)) + '</span>' +
        '<span class="ol-short">' + escapeHtml(shortName) + '</span></span>' +
        '<span class="ol-price">¥' + priceOf(orderState, dateStr) + (done ? '<span class="ol-done">・手配済</span>' : '') + '</span>';
    } else {
      cell.classList.add('empty');
      icon.textContent = '━';
      label.textContent = 'なし';
    }
    var chips = cell.querySelector('.menu-chips');
    cell.insertBefore(icon, chips);
    cell.insertBefore(label, chips);

    // 拠点バッジ（注文ありの場合のみ）
    if (orderState && location) {
      var badge = document.createElement('span');
      badge.className = 'location-badge ' + (location === '新工場' ? 'shin' : 'honsha');
      badge.textContent = location === '新工場' ? '📍新' : '📍本';
      cell.appendChild(badge);
    }
  }

  // ===== 日付クリックで注文を順に切り替え（従来どおり） =====
  // ー → 弁当 → おかずのみ →（その日に選べる 麺 → 丼 → 特弁）→ ー
  // 麺・丼・特弁は、受付期間の日で締切前のときだけ順番に入る
  function cycleOrder(dateStr) {
    var list = [''];
    state.menus.forEach(function(m) {
      if (m.kind === 'always') list.push(m.key);
      else if (earlyOpen(m.key, dateStr)) list.push(m.key);
    });
    return list;
  }

  function onCellClick(dateStr, cell) {
    if (!state.currentUser) return;
    var rez = state.reservations[state.currentUser.code + '_' + dateStr];
    var cur = rez ? rez.orderState : '';
    var list = cycleOrder(dateStr);
    var i = list.indexOf(cur);
    var next = i === -1 ? '' : list[(i + 1) % list.length];
    onSelectMenu(dateStr, cell, next);
  }

  // ===== メニュー決定（拠点は現在のモードで決定） =====
  function onSelectMenu(dateStr, cell, next) {
    if (!state.currentUser) return;

    // 拠点決定: 通常モード→デフォルト拠点、拠点変更モード→逆の拠点
    var defaultLoc = state.currentUser.location;
    var oppositeLoc = defaultLoc === '新工場' ? '本社工場' : '新工場';
    var location = state.locationMode ? oppositeLoc : defaultLoc;

    var key = state.currentUser.code + '_' + dateStr;
    var rez = state.reservations[key];
    var cur = rez ? rez.orderState : '';
    if (cur === next && (!next || (rez && rez.location === location))) return;

    var updated = {
      workerCode: state.currentUser.code,
      workerName: state.currentUser.name,
      date: dateStr,
      orderState: next,
      location: location,
      updatedAt: new Date().toISOString(),
      updatedBy: INIT_CURRENT_USER_EMAIL
    };
    state.reservations[key] = updated;

    applyCellDisplay(cell, next, location);

    ChangeQueue.add({
      workerCode: state.currentUser.code,
      workerName: state.currentUser.name,
      date: dateStr,
      orderState: next,
      location: location
    });
    DraftStore.save(state.currentUser.code, [{ date: dateStr, orderState: next, location: location }]);
    SaveManager.scheduleSave();
    state.hadAnyChangeThisSession = true;

    // 集計再描画（現在月+次月の2ヶ月分）
    var today = state.today;
    var y = today.getFullYear(), mo = today.getMonth();
    var ms = new Date(y, mo, 1);
    var me = new Date(y, mo + 2, 0);
    renderSummary(ms, me);
  }

  // ===== 締切判定 =====
  function isPastTodayDeadline() {
    var now = new Date();
    return now.getHours() >= DEADLINE_HOUR;
  }

  function isPastSatDeadline(satDateStr) {
    // 出勤土曜の前日（金曜）15:00締切
    var sat = new Date(satDateStr + 'T00:00:00+09:00');
    var fri = new Date(sat);
    fri.setDate(fri.getDate() - 1);
    var friStr = formatYmd(fri);
    var now = new Date();
    var nowStr = formatYmd(now);
    if (nowStr > friStr) return true;
    if (nowStr === friStr && now.getHours() >= SAT_DEADLINE_HOUR) return true;
    return false;
  }

  function isBeyondWindow(dateStr) {
    var today = new Date(state.todayStr + 'T00:00:00+09:00');
    var limit = new Date(today);
    limit.setDate(limit.getDate() + RESERVATION_WINDOW_DAYS);
    var target = new Date(dateStr + 'T00:00:00+09:00');
    return target > limit;
  }

  // 保存が恒久的に失敗する日付か（過去日・当日締切超過・出勤土曜締切超過）
  // セル編集可否（renderCalendar）と同一基準。下書き復元・失敗処理の判定に使う
  function isDateLocked(dateStr) {
    var calEntry = state.calendarMap[dateStr];
    var isWorkSat = calEntry && calEntry.type === '出勤土曜';
    if (dateStr < state.todayStr) return true;
    if (dateStr === state.todayStr && isPastTodayDeadline()) return true;
    if (isWorkSat && isPastSatDeadline(dateStr)) return true;
    return false;
  }

  // 「prev → next」への変更が、何度送っても通らないか（日付の締切＋麺・丼・特弁の締切と受付）
  function isChangeLocked(dateStr, next, prev) {
    if (isDateLocked(dateStr)) return true;
    if (next === prev) return false;
    var pastEarly = new Date() >= earlyDeadline(dateStr);
    if (prev && isEarly(prev) && pastEarly) return true;
    if (next && isEarly(next) && (!offered(next, dateStr) || pastEarly)) return true;
    return false;
  }

  // ===== 集計描画 =====
  function renderSummary(monthStart, monthEnd) {
    if (!state.currentUser) return;
    var el = document.getElementById('calSummary');
    el.innerHTML = '';

    var code = state.currentUser.code;
    var cnt = {};
    state.menus.forEach(function(m) { cnt[m.key] = { total: 0, done: 0, plan: 0 }; });

    var cur = new Date(monthStart);
    while (cur <= monthEnd) {
      var ds = formatYmd(cur);
      var rez = state.reservations[code + '_' + ds];
      if (rez && rez.orderState && cnt[rez.orderState]) {
        var isPast = ds < state.todayStr;
        cnt[rez.orderState].total++;
        if (isPast) cnt[rez.orderState].done++; else cnt[rez.orderState].plan++;
      }
      cur.setDate(cur.getDate() + 1);
    }

    var startM = monthStart.getMonth() + 1;
    var endM = monthEnd.getMonth() + 1;
    var label = startM + '月・' + endM + '月';

    var total = 0;
    var html = '';
    html += '<div class="cal-summary-item"><span class="label" style="font-weight:700; font-size:15px;">' + label + '</span></div>';
    state.menus.forEach(function(m) {
      var c = cnt[m.key];
      total += c.total;
      if (m.kind !== 'always' && c.total === 0) return;   // 麺・丼・特弁は頼んだときだけ出す
      html += '<div class="cal-summary-item"><span class="label">' + iconHtml(m.key, 'sm') + ' ' + escapeHtml(m.label) + ':</span><span class="count">' + c.total + '</span>個';
      html += '<span class="sub">（実績' + c.done + ' + 予定' + c.plan + '）</span></div>';
    });
    html += '<div class="cal-summary-item"><span class="label">合計:</span><span class="count">' + total + '</span>個</div>';

    el.innerHTML = html;
  }

  // ===== 拠点変更モード切替 =====
  function toggleLocationMode() {
    state.locationMode = !state.locationMode;
    document.getElementById('calBentoBox').classList.toggle('location-mode', state.locationMode);
    document.getElementById('locationBtn').classList.toggle('active', state.locationMode);
  }

  // ===== カレンダーを閉じる =====
  function closeCalendar() {
    // 変更があった場合のみトーストを表示
    var hadChanges = ChangeQueue.hasChanges() || state.hadAnyChangeThisSession === true;
    if (ChangeQueue.hasChanges()) {
      flushChanges();
    }
    document.getElementById('calendarModal').classList.remove('active');
    state.locationMode = false;
    state.hadAnyChangeThisSession = false;
    state.currentUser = null;
    document.getElementById('calBentoBox').classList.remove('location-mode');
    document.getElementById('locationBtn').classList.remove('active');

    // プルダウンと検索窓をリセット（同じ名前を再選択できるように）
    var deptSel = document.getElementById('dept-select');
    var nameSel = document.getElementById('name-select');
    var nameSearch = document.getElementById('name-search');
    if (deptSel) deptSel.value = '';
    if (nameSel) nameSel.innerHTML = '<option value="">-- 名前を選択 --</option>';
    if (nameSearch) nameSearch.value = '';

    if (hadChanges) showToast('保存しました');
  }

  // ===== トースト =====
  var toastTimer = null;
  function showToast(msg, isError) {
    var toast = document.getElementById('toast');
    if (!toast) return;
    toast.textContent = msg;
    toast.style.background = isError ? '#c94040' : '';
    toast.style.animationDuration = isError ? '4s' : '';
    toast.classList.remove('active');
    void toast.offsetWidth;
    toast.classList.add('active');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() { toast.classList.remove('active'); }, isError ? 4000 : 2000);
  }

  // ===== ヘルパー =====
  function formatYmd(d) {
    var y = d.getFullYear();
    var m = ('0' + (d.getMonth() + 1)).slice(-2);
    var day = ('0' + d.getDate()).slice(-2);
    return y + '-' + m + '-' + day;
  }

  // ===== 起動 =====
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
